margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style></head><body class="bg-surface font-body-md text-on-surface flex flex-col min-h-screen"><header class="fixed top-0 inset-x-0 z-50 bg-surface/80 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.3)] pt-safe"><div class="h-16 px-gutter-mobile flex items-center justify-between"><div class="flex items-center gap-space-sm"><div class="w-9 h-9 rounded-lg bg-surface-container-high flex items-center justify-center text-primary shadow-[0_0_12px_rgba(16,185,129,0.2)]"><span class="material-symbols-outlined text-[22px]">eco</span></div><span class="font-headline-sm text-headline-sm font-bold tracking-tight text-on-surface">Animalec</span></div><div class="flex items-center gap-space-sm"><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div><button aria-label="Menu" class="min-w-[44px] min-h-[44px] flex items-center justify-center text-on-surface rounded-lg active:bg-surface-container transition-colors"><span class="material-symbols-outlined text-[24px]">menu</span></button></div></div></header><main class="flex flex-col relative w-full pt-16 bg-surface min-h-screen"><div class="flex flex-col w-full px-margin-mobile pb-12 pt-space-lg select-none">
<!-- Ambient Telemetry Grid Subtle Glow Background -->
<div class="relative w-full max-w-sm mx-auto flex flex-col">
<!-- Bioluminescent Ambient Accent -->
<div class="absolute -top-10 left-1/2 -translate-x-1/2 w-48 h-48 bg-primary/10 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute top-40 right-0 w-36 h-36 bg-secondary/10 rounded-full blur-2xl pointer-events-none"></div>
<!-- Screen Title: Centered Modern Prominent Typography -->
<div class="flex flex-col items-center justify-center text-center mt-space-md mb-space-xl relative z-10">
<div class="inline-flex items-center gap-space-xs px-3 py-1 rounded-full bg-surface-container-high/80 mb-space-sm shadow-sm">


</div>
<h1 class="font-headline-xl-mobile text-headline-xl-mobile font-bold tracking-tight text-on-surface uppercase">
        LOGIN
      </h1>

</div>
<!-- Login Surface Card -->
<div class="relative z-10 bg-surface-container/90 backdrop-blur-md rounded-xl p-space-lg shadow-xl shadow-surface-container-lowest/50 flex flex-col gap-space-lg">
<form class="flex flex-col gap-space-lg" id="loginForm" onsubmit="event.preventDefault(); handleLogin();">
<!-- Field 1: Usuário -->
<div class="flex flex-col gap-space-xs group">
<div class="flex justify-between items-center px-0.5">
<label class="font-label-lg text-label-lg text-on-surface font-semibold tracking-wide" for="usernameInput">
              Usuário
            </label>
<span class="font-label-sm text-label-sm text-primary flex items-center gap-1 opacity-80">
<span class="w-1.5 h-1.5 rounded-full bg-primary animate-pulse"></span>
              ID Ativo
            </span>
</div>
<div class="relative flex items-center">
<div class="absolute left-3.5 flex items-center pointer-events-none text-on-surface-variant group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">badge</span>
</div>
<input autocomplete="username" class="w-full pl-11 pr-4 py-3.5 rounded-lg bg-surface-container-highest text-on-surface placeholder:text-on-surface-variant/50 font-body-md text-body-md outline-none transition-all duration-200 focus:bg-surface-container-high focus:shadow-[0_0_0_2px_rgba(78,222,163,0.35)]" id="usernameInput" placeholder="ex: biologo_joao" required="" type="text">
</div>
</div>
<!-- Field 2: Senha -->
<div class="flex flex-col gap-space-xs group">
<div class="flex justify-between items-center px-0.5">
<label class="font-label-lg text-label-lg text-on-surface font-semibold tracking-wide" for="passwordInput">
              Senha
            </label>
<span class="font-label-sm text-label-sm text-on-surface-variant/60">Criptografado</span>
</div>
<div class="relative flex items-center">
<div class="absolute left-3.5 flex items-center pointer-events-none text-on-surface-variant group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">key</span>
</div>
<input autocomplete="current-password" class="w-full pl-11 pr-11 py-3.5 rounded-lg bg-surface-container-highest text-on-surface placeholder:text-on-surface-variant/40 font-body-md text-body-md outline-none transition-all duration-200 focus:bg-surface-container-high focus:shadow-[0_0_0_2px_rgba(78,222,163,0.35)] tracking-wider" id="passwordInput" placeholder="••••••••••••" required="" type="password">
<button aria-label="Alternar visibilidade de senha" class="absolute right-2.5 min-w-[36px] min-h-[36px] flex items-center justify-center text-on-surface-variant hover:text-on-surface transition-colors" id="togglePasswordBtn" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined text-[20px]" id="pwdIcon">visibility</span>
</button>
</div>
</div>
<!-- Telemetry Status feedback container -->
<div class="hidden items-center gap-space-sm p-space-sm rounded-lg bg-error-container text-on-error-container text-body-sm font-body-sm transition-all" id="loginFeedback">
<span class="material-symbols-outlined text-[18px]">error</span>
<span id="feedbackText">Preencha todos os campos para autenticar.</span>
</div>
<!-- Action Button: ENTRAR -->
<button class="relative overflow-hidden w-full mt-space-sm py-4 rounded-lg bg-primary hover:bg-primary-container active:scale-[0.99] text-on-primary font-headline-sm text-headline-sm font-bold tracking-wider uppercase transition-all duration-200 shadow-[0_0_20px_rgba(78,222,163,0.35)] flex items-center justify-center gap-space-sm" id="btnEntrar" type="submit">
<span class="relative z-10 flex items-center gap-2">
            ENTRAR
            <span class="material-symbols-outlined text-[22px]">arrow_forward</span>
</span>
<div class="hidden absolute inset-0 bg-primary-container items-center justify-center" id="loadingPulse">
<span class="material-symbols-outlined animate-spin text-[24px]">progress_activity</span>
</div>
</button>
</form>
<!-- Specimen Observatory Protocol Note -->
<div class="flex items-center justify-center gap-space-xs pt-space-xs text-center">


</div>
</div>
<!-- Wildlife telemetry mini-footer decorative badge -->
<div class="mt-space-xl flex items-center justify-center gap-space-sm text-on-surface-variant/40">


</div>
</div>
</div>
<script>
  function togglePassword() {
    var pwdField = document.getElementById('passwordInput');
    var pwdIcon = document.getElementById('pwdIcon');
    if (!pwdField || !pwdIcon) return;
    
    if (pwdField.type === 'password') {
      pwdField.type = 'text';
      pwdIcon.textContent = 'visibility_off';
    } else {
      pwdField.type = 'password';
      pwdIcon.textContent = 'visibility';
    }
  }

  function handleLogin() {
    var userInput = document.getElementById('usernameInput');
    var passInput = document.getElementById('passwordInput');
    var feedback = document.getElementById('loginFeedback');
    var feedbackText = document.getElementById('feedbackText');
    var btn = document.getElementById('btnEntrar');
    var loader = document.getElementById('loadingPulse');

    if (!userInput.value.trim() || !passInput.value) {
      if (feedback && feedbackText) {
        feedback.classList.remove('hidden');
        feedback.classList.add('flex');
        feedbackText.textContent = 'Informe usuário e senha para acessar.';
      }
      return;
    }

    if (feedback) {
      feedback.classList.add('hidden');
      feedback.classList.remove('flex');
    }

    if (loader) {
      loader.classList.remove('hidden');
      loader.classList.add('flex');
    }

    setTimeout(function() {
      if (loader) {
        loader.classList.add('hidden');
        loader.classList.remove('flex');
      }
      btn.innerHTML = '<span class="material-symbols-outlined text-[22px]">check_circle</span> AUTORIZADO';
      btn.classList.remove('bg-primary');
      btn.classList.add('bg-secondary-container', 'text-on-secondary-container');
    }, 900);
  }
</script></main>

</body></html>

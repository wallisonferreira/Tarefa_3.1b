</label>

<input class="w-full h-12 bg-surface-container-low rounded-lg px-space-md font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:bg-surface-container-highest transition-all duration-200" id="nome" name="nome" placeholder="Ex: Dr.ª Clara Vasconcelos" required="" type="text">

</div>
</div>
<!-- Field 3: Email -->

<label class="font-label-md text-label-md uppercase tracking-wider text-on-surface flex items-center gap-1.5" for="email">

<!-- Interactive State Confirmation Toast -->
<div class="fixed bottom-6 inset-x-4 max-w-sm mx-auto bg-surface-container-highest text-on-surface p-space-md rounded-xl shadow-2xl flex items-center gap-space-sm transform translate-y-32 opacity-0 pointer-events-none transition-all duration-300 z-50" id="toast-success">
<div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center text-on-primary shrink-0">
<span class="material-symbols-outlined text-[18px]">check</span>
</div>

<span class="font-label-md text-label-md font-bold text-on-surface">Especialista Registado</span>

</div>
</div>
<script>
    // Ensure header navigation highlights 'ESPECIALISTAS'
    (function highlightActiveTab() {
      const links = document.querySelectorAll('header nav a[data-path]');
      links.forEach(link => {
        if (link.getAttribute('data-path') === 'admin-especialistas') {
          link.classList.remove('text-on-surface-variant');
          link.classList.add('text-primary', 'font-bold');
        }
      });
    })();

    function showSuccessFeedback() {
      const btn = document.getElementById('btn-submit');
      const toast = document.getElementById('toast-success');
      const originalHTML = btn.innerHTML;

      btn.disabled = true;
      btn.innerHTML = '<span class="material-symbols-outlined text-[20px] animate-spin">refresh</span><span>A GRAVAR...</span>';

      setTimeout(() => {
        btn.innerHTML = '<span class="material-symbols-outlined text-[20px]">task_alt</span><span>GUARDADO COM SUCESSO</span>';
        btn.classList.remove('bg-primary', 'text-on-primary');
        btn.classList.add('bg-primary-container', 'text-on-primary-container');

        if (toast) {
          toast.classList.remove('translate-y-32', 'opacity-0', 'pointer-events-none');
          toast.classList.add('translate-y-0', 'opacity-100');
        }

        setTimeout(() => {
          btn.disabled = false;
          btn.innerHTML = originalHTML;
          btn.classList.remove('bg-primary-container', 'text-on-primary-container');
          btn.classList.add('bg-primary', 'text-on-primary');

          if (toast) {
            toast.classList.add('translate-y-32', 'opacity-0', 'pointer-events-none');
            toast.classList.remove('translate-y-0', 'opacity-100');
          }
        }, 2600);
      }, 700);
    }
  </script>

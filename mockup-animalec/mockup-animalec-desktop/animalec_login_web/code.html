em","margin-mobile":"1rem","space-md":"1rem","margin":"2.5rem","space-sm":"0.5rem","space-lg":"1.5rem"},"fontFamily":{"headline-sm":["Plus Jakarta Sans"],"body-lg":["Inter"],"body-md":["Inter"],"headline-xl-mobile":["Plus Jakarta Sans"],"label-sm":["Plus Jakarta Sans"],"body-sm":["Inter"],"headline-md":["Plus Jakarta Sans"],"label-lg":["Plus Jakarta Sans"],"headline-xl":["Plus Jakarta Sans"],"label-md":["Plus Jakarta Sans"],"headline-lg":["Plus Jakarta Sans"],"display-lg-mobile":["Plus Jakarta Sans"],"display-lg":["Plus Jakarta Sans"]},"fontSize":{"headline-sm":["1.25rem",{"lineHeight":"1.75rem","letterSpacing":"0em","fontWeight":"600"}],"body-lg":["1.125rem",{"lineHeight":"1.75rem","letterSpacing":"-0.01em","fontWeight":"400"}],"body-md":["1rem",{"lineHeight":"1.5rem","letterSpacing":"0em","fontWeight":"400"}],"headline-xl-mobile":["1.75rem",{"lineHeight":"2.25rem","letterSpacing":"-0.015em","fontWeight":"700"}],"label-sm":["0.6875rem",{"lineHeight":"0.875rem","letterSpacing":"0.08em","fontWeight":"600"}],"body-sm":["0.875rem",{"lineHeight":"1.25rem","letterSpacing":"0em","fontWeight":"400"}],"headline-md":["1.5rem",{"lineHeight":"2rem","letterSpacing":"-0.01em","fontWeight":"600"}],"label-lg":["0.875rem",{"lineHeight":"1.25rem","letterSpacing":"0.04em","fontWeight":"700"}],"headline-xl":["2.5rem",{"lineHeight":"3rem","letterSpacing":"-0.02em","fontWeight":"700"}],"label-md":["0.75rem",{"lineHeight":"1rem","letterSpacing":"0.06em","fontWeight":"600"}],"headline-lg":["2rem",{"lineHeight":"2.5rem","letterSpacing":"-0.02em","fontWeight":"700"}],"display-lg-mobile":["2.25rem",{"lineHeight":"2.75rem","letterSpacing":"-0.02em","fontWeight":"800"}],"display-lg":["3.5rem",{"lineHeight":"4.25rem","letterSpacing":"-0.03em","fontWeight":"800"}]}}}};</script></head><body class="bg-surface font-body-md text-on-surface antialiased flex min-h-screen items-center justify-center p-gutter"><main class="w-full max-w-md mx-auto"><div class="flex flex-col w-full">
<!-- Minimalist Observatory Navbar (Internal Layout Component) -->

<!-- Login Main Stage (Centered Slate Container) -->
<div class="w-full flex items-center justify-center relative py-space-sm">
<!-- Atmospheric Ambient Bioluminescent Backdrops -->
<div class="absolute -top-12 -left-12 w-64 h-64 rounded-full bg-primary/10 blur-[80px] pointer-events-none"></div>
<div class="absolute -bottom-10 -right-10 w-72 h-72 rounded-full bg-secondary/10 blur-[90px] pointer-events-none"></div>
<!-- Telemetry Frame / Central Login Card -->
<div class="w-full max-w-md bg-surface-container-low rounded-xl shadow-xl p-space-xl relative z-10 overflow-hidden backdrop-blur-md">
<!-- Top Subtle Telemetry Sensor Line -->
<div class="absolute top-0 left-0 right-0 h-[2px] bg-gradient-to-r from-transparent via-primary to-transparent opacity-80"></div>
<!-- Card Header / Title -->
<div class="flex flex-col items-center justify-center mb-space-lg text-center">
<div class="w-12 h-12 rounded-xl bg-surface-container flex items-center justify-center text-primary mb-space-sm shadow-md">

</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface tracking-wide uppercase font-extrabold">
          LOGIN
        </h1>

</div>
<!-- Authentication Form -->
<form class="flex flex-col gap-space-md" id="loginForm" onsubmit="event.preventDefault(); handleAuth();">
<!-- Field 1: Usuário -->
<div class="flex flex-col gap-space-xs">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface tracking-wider font-semibold" for="usernameInput">
              Usuário
            </label>

</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-on-surface-variant text-[20px] pointer-events-none">badge</span>
<input autocomplete="username" class="w-full bg-surface-container-highest text-on-surface font-body-md text-body-md rounded-lg py-3 pl-11 pr-4 placeholder:text-outline focus:outline-none focus:bg-surface-container transition-all shadow-inner" id="usernameInput" placeholder="ex: biologo_joao" required="" type="text">
</div>
</div>
<!-- Field 2: Senha -->
<div class="flex flex-col gap-space-xs">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface tracking-wider font-semibold" for="passwordInput">
              Senha
            </label>
<a class="font-label-sm text-label-sm text-secondary hover:underline tracking-wide" href="#">
              Esqueceu?
            </a>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-on-surface-variant text-[20px] pointer-events-none">lock</span>
<input autocomplete="current-password" class="w-full bg-surface-container-highest text-on-surface font-body-md text-body-md rounded-lg py-3 pl-11 pr-11 placeholder:text-outline focus:outline-none focus:bg-surface-container transition-all shadow-inner tracking-widest" id="passwordInput" placeholder="••••••••••••" required="" type="password">
<button class="absolute right-3.5 text-on-surface-variant hover:text-primary transition-colors flex items-center justify-center p-1 focus:outline-none" id="togglePasswordBtn" onclick="togglePasswordVisibility()" title="Alternar visibilidade da senha" type="button">
<span class="material-symbols-outlined text-[20px]" id="togglePasswordIcon">visibility</span>
</button>
</div>
</div>
<!-- System Status Telemetry Dot -->
<div class="flex items-center justify-between py-1 px-1">
<div class="flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-primary animate-ping"></span>

</div>

</div>
<!-- Main Glowing Action Button -->
<button class="w-full mt-space-xs py-3.5 px-6 rounded-lg bg-primary text-on-primary font-label-lg text-label-lg uppercase tracking-wider font-bold transition-all duration-300 shadow-md hover:bg-primary-fixed hover:text-on-primary-fixed hover:shadow-primary/30 flex items-center justify-center gap-2 cursor-pointer active:scale-[0.99]" id="submitButton" type="submit">
<span>ENTRAR</span>
<span class="material-symbols-outlined text-[20px] font-bold">arrow_forward</span>
</button>
</form>
<!-- Security / Encryption Footnote Indicator -->
<div class="mt-space-lg pt-space-md flex items-center justify-center gap-1.5 text-center">


</div>
</div>
</div>
<!-- Client-side Interactive Logic -->
<script>
    function togglePasswordVisibility() {
      const passwordInput = document.getElementById('passwordInput');
      const toggleIcon = document.getElementById('togglePasswordIcon');
      
      if (!passwordInput || !toggleIcon) return;

      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleIcon.textContent = 'visibility_off';
      } else {
        passwordInput.type = 'password';
        toggleIcon.textContent = 'visibility';
      }
    }

    function handleAuth() {
      const btn = document.getElementById('submitButton');
      const user = document.getElementById('usernameInput');
      if (!btn || !user) return;

      const originalHtml = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = `
        <span class="material-symbols-outlined animate-spin text-[20px]">sync</span>
        <span>VERIFICANDO...</span>
      `;
      btn.classList.add('opacity-90');

      setTimeout(() => {
        btn.innerHTML = `
          <span class="material-symbols-outlined text-[20px]">check_circle</span>
          <span>AUTENTICADO</span>
        `;
        btn.classList.remove('bg-primary');
        btn.classList.add('bg-secondary', 'text-on-secondary');

        setTimeout(() => {
          btn.innerHTML = originalHtml;
          btn.disabled = false;
          btn.classList.remove('bg-secondary', 'text-on-secondary');
          btn.classList.add('bg-primary');
        }, 1800);
      }, 900);
    }
  </script>
</div></main>

</body></html>
